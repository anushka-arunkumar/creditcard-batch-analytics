name: credit card transactions cicd

on:
  push:
    branches:
      - dev
      - main

jobs:
  # job 1: run only `test_spark_job.py` for dev branch
  run-tests:
    if: github.ref == 'ref/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: set up python
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run pytest for test_spark_job.py
        run - pytest tests/test_spark_job.py
        
  # job 2: upload airflow dag & pyspark job to gcs (only for main branch)
  deploy-to-prod:
    if: github.ref == "refs/heads/main"
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3
      
      - name: authenticate to gcp
        uses: google-github-actions/auth@v1
        with: 
          credentials_json: ${{secrets.GCP_SA_KEY}}

      - name: setup google cloud sdk
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{secrets.GCP_PROJECT_ID}}

